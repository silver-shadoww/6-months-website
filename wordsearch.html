<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tidbits From Our Dates ♡</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/wordsearch.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

</head>

<body>

<div class="wordsearch-page">

    <h1>
        Tidbits From Our Dates... ♡
    </h1>

    <div class="game-container">

        <div class="grid-card">

            <div id="grid"></div>

        </div>

        <div class="words-card">

            <h2>Find These ♡</h2>

            <ul id="wordList">

                <li data-word="ZOOTOPIA">Zootopia</li>

                <li data-word="ICECREAM">Ice Cream</li>

                <li data-word="SUSHI">Sushi</li>

                <li data-word="ROSES">Roses</li>

                <li data-word="PASTA">Pasta</li>

                <li data-word="LUMAS">Lumas</li>

                <li data-word="ROCKY">Rocky</li>

                <li data-word="CALIB">Calib</li>

                <li data-word="FREAKYNIKKI">Freaky Nikki</li>

            </ul>

            <button
                id="continueBtn"
                style="display:none;"
            >
                Continue ♡
            </button>

        </div>

    </div>

</div>

<audio id="bgMusic" loop>
    <source src="audio/our-song.mp3" type="audio/mpeg">
</audio>
<script src="js/wordsearch.js"></script>
<script src="js/music.js"></script>


</body>
</html>
