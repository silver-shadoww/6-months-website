<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 6 Months ♡</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/envelope.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

</head>
<body>

<div class="page">

    <div class="envelope-wrapper">

        <img
            src="images/ui/envelope-closed.png"
            id="closedEnvelope"
            class="envelope-image"
        >

        <img
            src="images/ui/envelope-open.png"
            id="openEnvelope"
            class="envelope-image hidden"
        >

        <div id="letterContent">

            <h1 id="typedText"></h1>

            <button id="nextBtn">
                ↓
            </button>

        </div>

    </div>

</div>

<audio id="bgMusic" loop>
    <source src="audio/our-song.mp3" type="audio/mpeg">
</audio>

<script src="js/envelope.js"></script>
<script src="js/music.js"></script>

</body>
</html>
