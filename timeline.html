<!DOCTYPE html>
<html lang="en">

<body>

<div class="timeline-page">

    <h1>

        </div></div>

        <div class="polaroid lower"><div class="inner">
            <div class="front"><img src="images/timeline/pic2.jpg"></div>
            <div class="back">1 ♥ Jan</div>
        </div></div>

        <div class="polaroid"><div class="inner">
            <div class="front"><img src="images/timeline/pic3.jpg"></div>
            <div class="back">14 ♥ Feb</div>
        </div></div>

        <div class="polaroid lower"><div class="inner">
            <div class="front"><img src="images/timeline/pic4.jpg"></div>

        <div class="polaroid"><div class="inner">
            <div class="front"><img src="images/timeline/pic5.jpg"></div>

            <div class="front"><img src="images/timeline/pic6.jpg"></div>

        </div></div>

        <div class="polaroid"><div class="inner">
            <div class="front"><img src="images/timeline/pic7.jpg"></div>

        </div></div>

        <div class="polaroid lower"><div class="inner">
            <div class="front"><img src="images/timeline/pic8.jpg"></div>
            <div class="back">9 ♥ Jun</div>
        </div></div>

        <div class="polaroid"><div class="inner">
            <div class="front"><img src="images/timeline/pic9.jpg"></div>
            <div class="back">13 ♥ Jun</div>
        </div></div>

    </div>

    <button id="continueBtn">
        Continue ♡
    </button>

</div>

<script>
document.getElementById("continueBtn").onclick = () =>{
    window.location.href = "wordsearch.html";
};
</script>

<audio id="bgMusic" loop>
    <source src="audio/our-song.mp3" type="audio/mpeg">
</audio>
<script src="js/music.js"></script>

</html>
