<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Versions Of Us ♡</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/findus.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

</head>

<body>

<div class="find-page">

    <h1>
        How many versions of us can you find? ♡
    </h1>

    <div class="scene-wrapper">

        <img
            src="images/ui/find-bg.png"
            class="scene"
        >

        <img src="images/hidden/pandas.png"
        class="hidden-item pandas">

        <img src="images/hidden/penguins.png"
        class="hidden-item penguins">

        <img src="images/hidden/ducks.png"
        class="hidden-item ducks">

        <img src="images/hidden/lumas.png"
        class="hidden-item lumas">

        <img src="images/hidden/sunflowers.png"
        class="hidden-item sunflowers">

        <img src="images/hidden/tortoises.png"
        class="hidden-item tortoises">

        <div id="hearts-container"></div>

    </div>

    <div id="completion">

        <h2>
            You found every version of us ♡
        </h2>

        <button id="continueBtn">
            Continue →
        </button>

    </div>

</div>

<audio id="bgMusic" loop>
    <source src="audio/our-song.mp3" type="audio/mpeg">
</audio>
<script src="js/findus.js"></script>
<script src="js/music.js"></script>



</body>
</html>
